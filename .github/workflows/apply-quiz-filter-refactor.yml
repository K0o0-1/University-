name: Apply quiz and filter refactor

on:
  push:
    branches:
      - fix-filter-quiz-state-20260929
    paths:
      - tools/apply_quiz_filter_refactor.py
      - .github/workflows/apply-quiz-filter-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-filter-quiz-state-20260929
      - name: Apply refactor
        run: python3 tools/apply_quiz_filter_refactor.py
      - name: Syntax checks
        run: |
          node --check assets/mcq-engine.js
          node --check assets/qa-engine.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets materials
          git add -u assets
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refactor filtering and quiz state"
            git push origin HEAD:fix-filter-quiz-state-20260929
          fi
