name: Apply V2 review fixes

on:
  push:
    branches:
      - feature-quiz-stats-v2-20260929
    paths:
      - tools/final_v2_review.py
      - .github/workflows/apply-v2-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-quiz-stats-v2-20260929
      - name: Apply final review fixes
        run: python3 tools/final_v2_review.py
      - name: Validate patched runtime
        run: |
          python3 tools/validate.py
          node --check assets/mcq-engine.js
          node --check assets/qa-engine.js
          node --check assets/study-v2.js
          node --check sw.js
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/study-v2.js tests/ui.spec.js
          if git diff --cached --quiet; then
            echo "No review fixes needed"
            exit 0
          fi
          git commit -m "Fix V2 analytics counting and exam concealment"
          git push origin HEAD:feature-quiz-stats-v2-20260929
