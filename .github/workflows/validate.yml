name: Validate study materials

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data and references
        run: python3 tools/validate.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/mcq-engine.js
          node --check assets/qa-engine.js
          node --check assets/study-v2.js
          node --check assets/study-plus.js
          node --check assets/navigation-phase1.js
          node --check assets/study-phase2.js
          node --check assets/question-card-phase3.js
          node --check assets/quiz-phase4.js
          node --check assets/analytics-phase5.js
          node --check data/enterprise-architecture.js
          node --check data/flutter-mcq.js
          node --check data/security-mcq.js
          node --check data/security-qa.js
          node --check sw.js

  ui-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/university-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/university-http.log
          exit 1
      - name: Run complete browser behavior suite
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests --workers=1
