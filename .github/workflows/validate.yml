name: Validate study materials

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate data and references
        run: python3 tools/validate.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/mcq-engine.js
          node --check assets/qa-engine.js
          node --check assets/study-v2.js
          node --check assets/study-plus.js
          node --check assets/navigation-phase1.js
          node --check assets/study-ui-loader.js
          node --check assets/study-phase2.js
          node --check assets/question-card-phase3.js
          node --check assets/quiz-phase4.js
          node --check assets/analytics-phase5.js
          node --check assets/print-phase6.js
          node --check assets/ui-hotfixes.js
          node --check assets/project-fixes.js
          node --check assets/materials-hub.js
          node --check assets/learning-loader.js
          node --check assets/learning-engine.js
          node --check data/materials-registry.js
          node --check data/flutter-learning.js
          node --check data/enterprise-architecture.js
          node --check data/flutter-mcq.js
          node --check data/security-mcq.js
          node --check data/security-qa.js
          node --check sw.js

  ui-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/university-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/university-http.log
          exit 1
      - name: Run complete Chromium behavior suite
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests --workers=1

  cross-browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Playwright Firefox and WebKit
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps firefox webkit
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/university-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/university-http.log
          exit 1
      - name: Firefox smoke test
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/cross-browser-smoke.spec.js --browser=firefox --workers=1
      - name: WebKit smoke test
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/cross-browser-smoke.spec.js --browser=webkit --workers=1


  package-preview:
    needs: [validate, ui-test, cross-browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble tested preview package
        run: |
          mkdir -p /tmp/University-Flexible-Learning-Preview
          rsync -a --exclude='.git' --exclude='node_modules' ./ /tmp/University-Flexible-Learning-Preview/
      - name: Upload tested preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: University-Flexible-Learning-Preview
          path: /tmp/University-Flexible-Learning-Preview/
          include-hidden-files: true
          retention-days: 7
