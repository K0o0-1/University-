name: Apply post-refactor cleanup

on:
  push:
    branches:
      - fix-filter-quiz-state-20260929
    paths:
      - tools/post_refactor_cleanup.py
      - .github/workflows/apply-post-refactor-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-filter-quiz-state-20260929
      - name: Apply cleanup
        run: python3 tools/post_refactor_cleanup.py
      - name: Validate
        run: |
          python3 tools/validate.py
          node --check assets/mcq-engine.js
          node --check assets/qa-engine.js
          node --check sw.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets sw.js tools/validate.py .github/workflows/validate.yml
          git add -u assets
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Clean up refactored study engines"
            git push origin HEAD:fix-filter-quiz-state-20260929
          fi
