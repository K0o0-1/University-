name: One-time repository maintenance

on:
  push:
    branches: [maintenance-full-audit-20260929]
    paths: ['.github/workflows/maintenance-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance-full-audit-20260929
          fetch-depth: 0
      - name: Apply maintenance script
        run: python3 tools/maintenance.py
      - name: Validate result
        run: python3 tools/validate.py
      - name: Commit audited result
        run: |
          rm -f tools/maintenance.py .github/workflows/maintenance-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Audit and repair study library"
          git push origin HEAD:maintenance-full-audit-20260929
