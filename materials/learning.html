<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Learning Material</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/learning-styles.css">
</head>
<body class="learning-page">
  <header class="learning-appbar">
    <div class="learning-appbar-inner">
      <a class="learning-back" href="../index.html" aria-label="العودة للمكتبة">‹</a>
      <button class="learning-brand" type="button" data-nav="study" aria-label="الرئيسية">
        <span class="learning-brandmark">L</span>
        <span><strong id="materialTitle">Learning Material</strong><small id="materialSubline">Study • Quiz • Review</small></span>
      </button>
      <nav class="learning-desktop-nav" aria-label="التنقل الرئيسي">
        <button data-nav="study" class="learning-nav-btn active">📚 Study</button>
        <button data-nav="quiz" class="learning-nav-btn">📝 Quiz</button>
        <button data-nav="review" class="learning-nav-btn">🚩 Review</button>
        <button id="learningMoreBtn" class="learning-nav-btn" aria-haspopup="menu" aria-expanded="false">المزيد ⋮</button>
      </nav>
    </div>
  </header>

  <div id="learningMoreMenu" class="learning-menu" hidden role="menu">
    <button role="menuitem" data-more="print">🖨 الطباعة</button>
    <button role="menuitem" data-more="analytics">📊 الإحصائيات</button>
    <button role="menuitem" data-more="cards">🃏 البطاقات</button>
    <button role="menuitem" data-more="dark">🌙 الوضع الليلي</button>
    <button role="menuitem" data-more="export">⬇ نسخة احتياطية</button>
    <label role="menuitem" class="learning-file-label">⬆ استعادة نسخة<input id="learningImportInput" type="file" accept="application/json" hidden></label>
    <button role="menuitem" class="learning-danger-text" data-more="reset">↺ إعادة الضبط</button>
  </div>

  <main id="app" tabindex="-1"><section class="learning-loading">جاري تحميل المادة…</section></main>

  <nav class="learning-mobile-nav" aria-label="التنقل على الهاتف">
    <button data-nav="study" class="active"><span>📚</span><small>Study</small></button>
    <button data-nav="quiz"><span>📝</span><small>Quiz</small></button>
    <button data-nav="review"><span>🚩</span><small>Review</small></button>
  </nav>

  <div id="learningToast" class="learning-toast" role="status" aria-live="polite"></div>
  <div id="learningPrintDocument" class="learning-print-document" aria-hidden="true"></div>

  <dialog id="learningPrintDialog" class="learning-dialog">
    <form method="dialog" class="learning-dialog-card" id="learningPrintForm">
      <div class="learning-dialog-head"><h2>إعداد الطباعة</h2><button value="cancel" class="learning-icon-btn" aria-label="إغلاق">✕</button></div>
      <label>المحتوى<select id="learningPrintType">
        <option value="content">الشرح فقط</option>
        <option value="content-examples">الشرح + الأمثلة</option>
        <option value="questions">بنك الأسئلة فقط</option>
        <option value="answers">الأسئلة + الإجابات</option>
        <option value="key">مفتاح الإجابات</option>
      </select></label>
      <label>النطاق<select id="learningPrintScope">
        <option value="all">كل المادة</option>
        <option value="module">Module محدد</option>
        <option value="chapter">Chapter محدد</option>
        <option value="topic">Topic محدد</option>
      </select></label>
      <label id="learningPrintTargetWrap">الاختيار<select id="learningPrintTarget"></select></label>
      <div id="learningPrintSummary" class="learning-print-summary"></div>
      <div class="learning-dialog-actions"><button type="button" class="learning-btn ghost" data-close-print>إلغاء</button><button type="button" class="learning-btn" id="learningDoPrintBtn">معاينة / طباعة</button></div>
    </form>
  </dialog>

  <dialog id="learningUtilityDialog" class="learning-dialog"><div class="learning-dialog-card wide" id="learningUtilityBody"></div></dialog>

  <script src="../data/materials-registry.js"></script>
  <script src="../assets/learning-loader.js"></script>
</body>
</html>
